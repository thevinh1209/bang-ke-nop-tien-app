<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng kê nộp tiền</title>
<style>
:root{--ink:#0f1b3d;--mut:#6b7a99;--line:#e6ebf5;--pri:#2563eb;--pri2:#1d4ed8;--soft:#e8efff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--sh:0 4px 18px rgba(30,64,175,.08)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f6f8ff,#e9f0ff) fixed;min-height:100vh}
main{max-width:1040px;margin:0 auto;padding:max(env(safe-area-inset-top,0px),28px) 16px calc(max(env(safe-area-inset-bottom,0px),56px) + 24px);display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px 28px;align-items:start}
section,aside{min-width:0;display:flex;flex-direction:column;gap:12px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:13px;box-shadow:var(--sh);flex:none}
h1{margin:0;font-size:21px;line-height:1.15}
#ver{display:block;color:var(--mut);font-size:13px;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
#gear{margin-left:auto;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);border:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:#fff;border-radius:20px;box-shadow:var(--sh);border:1px solid #eef1f8}
#upd{grid-column:1/-1;background:#fff7d6;border:1px solid #f0d36b;border-radius:14px;padding:10px 14px;font-weight:600}
#upd a{color:var(--pri2)}
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,.8fr);gap:10px}
.top .card{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lb{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;white-space:nowrap}
.lb .i{color:var(--pri);width:16px;height:16px}
.top input{border:0;background:transparent;padding:0;font:700 16px/1.2 inherit;color:var(--ink);width:100%;min-width:0}
.c-shop input{color:var(--pri2);font-size:18px;text-transform:uppercase}
.seg{display:flex;background:#eef2fb;border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:999px;padding:6px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.nd{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:9px 8px 9px 12px;font-size:14px}
.nd span{color:var(--mut);white-space:nowrap}.nd b{flex:1;min-width:0;word-break:break-word}
.nd button{padding:6px;border-radius:10px;border:0;background:#fff;color:var(--pri2);display:grid;place-items:center}
.tbl{overflow:hidden}
.th,.rw{display:grid;grid-template-columns:minmax(62px,.9fr) 118px minmax(84px,1.1fr);align-items:center;column-gap:6px;padding:0 14px}
.th{background:#f5f8ff;color:var(--mut);font-size:13.5px;padding-top:11px;padding-bottom:11px}
.th span:nth-child(2){text-align:center}.th span:last-child{text-align:right}
.rw{padding-top:7px;padding-bottom:7px;border-top:1px solid var(--line)}
.dn,.am{font-size:17px;font-variant-numeric:tabular-nums}.dn{font-weight:600}
.am{text-align:right}.am.z{color:#9aa6c0}
.st{display:flex;align-items:center;gap:4px}
.sb{width:32px;height:34px;border:0;border-radius:10px;font-size:20px;line-height:1;padding:0;background:#e9eef8;color:#33415f}
.sb[data-d="1"]{background:#dbe7ff;color:var(--pri2)}
.sb:active{filter:brightness(.92)}
.st input{width:46px;min-width:0;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;font:500 16px inherit;color:var(--ink);padding:0}
::placeholder{color:#9aa6c0}
.sum{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.9fr);background:linear-gradient(135deg,#eaf1ff,#dfe9ff);border:1px solid #d3e0fb;padding:14px 4px}
.sum>div{padding:0 12px;min-width:0}.sum>div+div{border-left:1px solid #cdd9f3}
.big{display:block;font-size:clamp(15px,4.6vw,21px);line-height:1.25;white-space:nowrap}
.s1{display:flex;align-items:center;gap:10px}
.coin{display:none;width:46px;height:46px;border-radius:50%;background:#d7e4ff;color:var(--pri);place-items:center;flex:none}
.coin .i{width:24px;height:24px}
.dvw{display:flex;align-items:baseline;gap:4px;color:var(--pri2)}
.dvw input{width:100%;min-width:0;border:0;background:transparent;padding:0;font:700 clamp(15px,4.6vw,21px)/1.25 inherit;color:var(--pri2)}
.dst{display:flex;flex-direction:column;gap:3px}.dst .rw2{display:flex;align-items:center;gap:6px}
.dst.ok{color:var(--ok)}.dst.bad{color:var(--bad)}.dst.over{color:var(--warn)}.dst.none{color:var(--mut)}
.dst .big{font-size:clamp(15px,4.6vw,20px)}.dst small{color:var(--ink);font-size:12.5px}
.dst svg{width:28px;height:28px;flex:none}
@media(min-width:480px){.coin{display:grid}}
.prow{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}
.prow button{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-weight:700;font-size:16px;border-radius:16px}
#pr{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;border:0;box-shadow:0 6px 16px rgba(37,99,235,.35)}
#img{background:#fff;color:var(--pri2);border:1.5px solid #bcd0fb}
.m{min-height:1.4em;margin:0;font-weight:600;font-size:14px}.m.ok{color:var(--ok)}.m.er{color:var(--bad)}
.hist,.prev{padding:2px 0}
.hh,.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.hh b,.ph b{font-size:16px}.hh>.i{width:22px;height:22px}
.hact{margin-left:auto;display:flex;gap:4px;align-items:center}
.hact button{padding:6px;border-radius:10px;border:0;background:#f1f4fb;color:#33415f;display:grid;place-items:center}
.hact button.t{display:flex;gap:4px;align-items:center;padding:6px 10px;font-size:13px;color:var(--bad);background:#fdecec}
#hc{color:var(--mut);font-size:14px}
.chev{width:18px;height:18px;color:var(--mut);transition:transform .15s}
.collapsed .chev{transform:rotate(-90deg)}.collapsed .hbody,.collapsed .pbody{display:none}
.hbody{position:relative;padding:0 10px 10px}
#hl{list-style:none;margin:0;padding:0;max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#hl li{display:grid;grid-template-columns:8px auto 1fr auto;align-items:center;gap:10px;background:#f5f8ff;border-radius:12px;padding:9px 12px;font-size:14px;min-height:40px}
#hl li i{width:8px;height:8px;border-radius:50%;background:var(--pri)}
#hl time{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
#hl li b{font-size:13.5px;white-space:nowrap}.pos{color:var(--ok)}.neg{color:var(--bad)}
#hl li.cur{background:#e3ecff;box-shadow:inset 0 0 0 1.5px #b9cffb}
#hl li.off{opacity:.45}
#hl li.em{display:block;text-align:center;color:var(--mut);background:transparent}
#hd{position:absolute;right:16px;bottom:16px;padding:6px 12px;border-radius:16px;background:var(--pri2);color:#fff;border:0;font-size:13px;box-shadow:0 2px 8px #0004}
.ph{flex-wrap:wrap}.ph .seg{margin-left:auto}.ph .seg button{font-size:12.5px;padding:5px 10px}
.pbody{padding:0 14px 14px}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-width:420px;margin:0 auto}
#cv{width:100%;display:block;outline:1px dashed #b7c0d4}
dialog{border:0;border-radius:22px;padding:20px;width:min(94vw,500px);box-shadow:0 20px 60px #0f1b3d66;color:var(--ink)}
dialog::backdrop{background:#0f1b3d66}
dialog h2{margin:0 0 6px;font-size:19px}
#ps{margin:4px 0 0;color:var(--mut);font-size:14px}
#pb{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#pb button{padding:13px;border-radius:14px;font-weight:600}
#pb button:first-child{background:var(--pri);color:#fff;border-color:var(--pri)}
#pb button.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
.g input,.g select{padding:8px;border:1px solid #cfd8ea;border-radius:10px;background:#fff;color:var(--ink);font:inherit}
.act{display:flex;gap:8px;margin-top:12px}
.act button,.act a{flex:1;text-align:center;padding:10px 12px;border:1px solid #cfd8ea;border-radius:12px;color:var(--ink);text-decoration:none;background:#fff}
#ok{background:var(--pri);color:#fff;border-color:var(--pri)}
#found{margin-top:8px;font-size:14px}#found button{margin:4px 6px 0 0}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
.sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sum>div.dst{grid-column:1/-1;border-left:0;border-top:1px solid #cdd9f3;margin-top:12px;padding-top:12px;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.dst .big{font-size:18px;white-space:nowrap}.dst small{font-size:14px;text-align:right}
.dvw input{width:1.4ch;flex:none;max-width:calc(100% - 16px)}
.hh{flex-wrap:wrap}.hh b{white-space:nowrap}
.hact{order:5;flex:1 1 100%;margin-left:0;display:flex;gap:6px}
.hact button{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;border:0;background:#f1f4fb;color:#33415f;font-size:13px}
.hact button.t{color:var(--bad);background:#fdecec}
#hc{margin-left:auto;color:var(--mut);font-size:14px}
@media(min-width:480px){
.sum{grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.95fr)}
.sum>div.dst{grid-column:auto;border-top:0;border-left:1px solid #cdd9f3;margin-top:0;padding-top:0;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px}
.dst small{text-align:left;font-size:12.5px}
.hact{order:0;flex:none;margin-left:auto}.hact .tx{display:none}.hact button{padding:6px}
#hc{margin-left:0}}
</style></head><body>

<script>
const D=[500000,200000,100000,50000,20000,10000,5000,2000,1000];
const $=s=>document.querySelector(s),f=n=>n.toLocaleString('vi-VN'),num=s=>+String(s).replace(/\D/g,'')||0;
let S={host:'192.168.50.232',port:'9100',w:'576',top:'2',bot:'8',cut:'B',pace:'0',th:'160',shop:'VH3',time:'1',bold:'1',dens:'0',kind:'dt',abbr:'0'};
try{Object.assign(S,JSON.parse(localStorage.kf_nt||'{}'))}catch(e){}
let R=[],total=0;
$('#tb').innerHTML=D.map((v,i)=>`<div class="rw"><span class="dn">${f(v)}</span><div class="st"><button type="button" class="sb" data-i="${i}" data-d="-1" aria-label="Giảm">−</button><input id="r${i}" inputmode="numeric" placeholder="0"><button type="button" class="sb" data-i="${i}" data-d="1" aria-label="Tăng">+</button></div><span class="am z" id="a${i}">0</span></div>`).join('');
$('#dt').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const say=(m,ok)=>document.querySelectorAll('.m').forEach(e=>{e.textContent=m;e.className='m '+(ok?'ok':'er')});

let pv=0;
const code=()=>String(S.shop||'').trim().toUpperCase().replace(/\s+/g,''),okCode=()=>/^[A-Z0-9]{3,4}$/.test(code());
const kindTxt=()=>S.kind==='tu'?'nop topup':(S.abbr==='1'?'nop DT':'nop doanh thu');
const dmyOf=()=>$('#dt').value.split('-').reverse().join('/');
const nd=()=>code()+' '+kindTxt()+' ngay '+dmyOf();
const sv=()=>{try{localStorage.kf_nt=JSON.stringify(S)}catch(x){}};
function setKind(k){S.kind=k;sv();document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on',b.dataset.kind===k));$('#lbd').textContent=k==='tu'?'Topup phải nộp':'Doanh thu phải nộp';calc()}
function tx(g,t,x,y,h,al,sz,w){let p=Math.round(sz);g.font=`bold ${p}px Arial`;while(g.measureText(String(t)).width>w&&p>10)g.font=`bold ${--p}px Arial`;g.textAlign=al;g.fillText(String(t),x,y+h/2+1);if(S.bold==='1'){g.strokeStyle=g.fillStyle;g.lineWidth=Math.max(1.2,p/20);g.lineJoin='round';g.strokeText(String(t),x,y+h/2+1)}}

function diffStr(){const due=$('#due').value?num($('#due').value):null;if(due===null)return'—';const d=total-due;return d===0?'0 (khớp)':(d>0?f(d)+' (thừa)':'-'+f(-d)+' (thiếu)')}
function draw(wd,im){
 if(wd===undefined)wd=pv;
 const W=+S.w,s=W/576,rh=Math.round(42*s),hh=Math.round(46*s),th=Math.round(56*s),cp=Math.round(34*s),ln=Math.round(52*s),dh=Math.round(62*s),gap=Math.round(16*s);
