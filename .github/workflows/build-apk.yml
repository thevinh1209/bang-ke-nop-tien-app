name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ghi số phiên bản vào trang
        run: |
          V="0.0.0"; [ "$GITHUB_REF_TYPE" = "tag" ] && V="${GITHUB_REF_NAME#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          sed -i "s/__VERSION__/$V/; s#__REPO__#$GITHUB_REPOSITORY#" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Thêm plugin in và số phiên bản
        run: |
          D=android/app/src/main/java/com/vh3/bangke
          mkdir -p "$D" && cp native/*.java "$D/"
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
      - name: Đổi icon và màn hình khởi động
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-*
          cp -r native/res/* $R/
          pip install pillow
          python native/make_splash.py $R native/icon.png
      - name: Dùng khóa ký cố định để cài đè được bản cũ
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BangKeNopTien.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BangKeNopTien-apk
          path: BangKeNopTien.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BangKeNopTien.apk
