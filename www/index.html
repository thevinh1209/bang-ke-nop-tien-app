<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng kê nộp tiền</title>
<style>
:root{--navy:#1c2a44;--ink:#1a1d24;--cell:#e2e4e8;--yel:#ffe600;--red:#c4161c;--bg:#f2f3f5}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:max(env(safe-area-inset-top,0px),36px) 20px calc(max(env(safe-area-inset-bottom,0px),56px) + 24px);display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:28px;align-items:start}
h1{grid-column:1/-1;margin:0;font-size:22px}
table{table-layout:fixed;width:100%;border-collapse:collapse;background:#fff;margin-bottom:10px}
th{background:var(--navy);color:#fff;padding:8px 4px;font-size:12px;font-weight:600}
th.y{color:#ffc928}
td{border:1px solid #000;padding:0}
td.d{text-align:right;padding:7px 8px;font-variant-numeric:tabular-nums}
td.n{background:var(--cell)}
td.tot{text-align:center;font-weight:700}
td.dl{text-align:center;font-weight:700;color:var(--red);padding:8px}
input,select{font:inherit;color:inherit}
td input{width:100%;border:0;background:transparent;padding:7px;text-align:center}
td input:focus{outline:2px solid var(--navy);outline-offset:-2px;background:#fff}
#due{text-align:right;padding-right:12px}
.f{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:600}
.f input{padding:6px 8px;border:1px solid #9aa1ad;border-radius:4px}
button{font:inherit;cursor:pointer;border:1px solid #1a1d24;border-radius:4px;background:#fff;padding:9px 14px}
#pr{width:100%;background:var(--yel);font-weight:800;font-size:17px;padding:13px}
#pr:focus-visible,button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.m{min-height:1.4em;margin:8px 0 0;font-weight:600}
.m.ok{color:#0a7a3d}.m.er{color:var(--red)}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px}
#gear{padding:9px;line-height:0;border-radius:50%;background:#fff}
dialog{border:0;border-radius:10px;padding:18px;width:min(94vw,480px);box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 4px;font-size:18px}
.tools{display:flex;gap:8px;margin-bottom:10px}.tools button{flex:1;min-width:0;white-space:nowrap;padding:8px 2px;font-size:13px}
section,aside{min-width:0}#diff{font-size:14px}
button:disabled{opacity:.4;cursor:default}
.st{display:flex;align-items:stretch}.st input{width:auto;flex:1;min-width:0;padding:8px 0;font-size:16px}
.sb{width:30px;border:0;border-radius:0;background:#c3c7cf;font-size:22px;line-height:1;padding:0}
.sb:active{background:#aab0ba}
.prow{display:flex;gap:8px}.prow #pr{flex:1}#img{padding:0 16px;font-weight:700;background:#fff}
.dng{background:var(--red);color:#fff;border-color:var(--red)}
#ps{margin:4px 0 0;color:#555;font-size:14px}#pb{display:flex;flex-direction:column;gap:8px;margin-top:14px}#pb button{padding:12px}
#found{margin-top:8px;font-size:14px}#found button{margin:4px 6px 0 0}
.act{display:flex;gap:8px;margin-top:14px}.act button{flex:1}
.act a{flex:1;text-align:center;border:1px solid #1a1d24;border-radius:4px;padding:9px 14px;color:inherit;text-decoration:none;background:#fff}
.paper{background:#fff;padding:14px;box-shadow:0 1px 0 #0003,0 8px 18px #0002;max-width:400px;margin-bottom:14px}
#cv{width:100%;display:block;image-rendering:crisp-edges;outline:1px dashed #9aa1ad}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
details{background:#fff;border:1px solid #cfd3da;border-radius:6px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g label{display:flex;flex-direction:column;gap:3px;font-size:13px}
.g input,.g select{padding:6px;border:1px solid #9aa1ad;border-radius:4px;background:#fff}
#upd{grid-column:1/-1;background:#fff3b0;border:1px solid #c9a400;border-radius:6px;padding:10px 14px;font-weight:600}
#upd a{color:#1c2a44}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr);padding-left:12px;padding-right:12px}}
@media print{@page{size:80mm auto;margin:0}body>*{display:none!important}#pbox{display:block!important}#pbox img{width:72mm;display:block;margin:0 auto}}
</style></head><body>
<main>
<header><h1>Bảng kê nộp tiền <small id="ver" style="font-weight:400;font-size:13px;color:#667"></small></h1><button id="gear" aria-label="Cài đặt máy in" title="Cài đặt máy in"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
<div id="upd" hidden></div>
<section>
 <label class="f">Ngày nộp <input type="date" id="dt"></label>
 <div class="tools"><button id="undo" disabled>↶ Hoàn tác</button><button id="redo" disabled>↷ Làm lại</button><button id="clr">Xóa toàn bộ</button></div>
 <table><colgroup><col style="width:28%"><col style="width:34%"><col></colgroup><thead><tr><th>MỆNH GIÁ<th>SỐ TỜ<th>THÀNH TIỀN</thead><tbody id="tb"></tbody>
 <tfoot><tr><td colspan="2" class="tot">TỔNG CỘNG<td class="d" id="tot">-
 <tr><td colspan="3" class="dl" id="dl"></tfoot></table>
 <table><tr><th class="y">DOANH THU PHẢI NỘP<th class="y">CHÊNH LỆCH
 <tr><td><input id="due" inputmode="numeric" placeholder="Nhập số tiền"><td class="d" id="diff">—</table>
 <div class="prow"><button id="pr">In bảng kê</button><button id="img">Xuất ảnh</button></div>
 <p id="msg" class="m"></p>
</section>
<aside>
 <div class="paper"><canvas id="cv"></canvas></div>
 
 
</aside>
</main>
<dialog id="pick"><h2 id="pt"></h2><p id="ps"></p><div id="pb"></div></dialog>
<dialog id="set"><h2>Cài đặt máy in</h2><div class="g">
  <label>Cửa hàng<input data-k="shop"></label>
  <label>IP máy in<input data-k="host"></label>
  <label>Cổng<input data-k="port" type="number"></label>
  <label>Khổ giấy<select data-k="w"><option value="576">80mm (576 chấm)</option><option value="384">58mm (384 chấm)</option></select></label>
  <label>Cắt giấy<select data-k="cut"><option value="B">Cắt một phần</option><option value="A">Cắt hẳn</option><option value="N">Không cắt</option></select></label>
  <label>Chừa trên (mm)<input data-k="top" type="number" min="0" max="40" step="1"></label>
  <label>Chừa dưới (mm)<input data-k="bot" type="number" min="0" max="60" step="1"></label>
  <label>Tốc độ gửi<select data-k="pace"><option value="0">Bình thường</option><option value="1">Chậm</option><option value="2">Rất chậm</option></select></label>
  <label>Ngưỡng đen (0–255)<input data-k="th" type="number" min="50" max="230"></label>
 </div><div class="g"><label>In giờ in<select data-k="time"><option value="1">Có</option><option value="0">Không</option></select></label>
  <label>In đậm (chữ, đường kẻ)<select data-k="bold"><option value="1">Có</option><option value="0">Không</option></select></label>
  <label>Lệnh độ đậm máy in<select data-k="dens"><option value="0">Tắt</option><option value="1">Đậm vừa</option><option value="2">Đậm</option><option value="3">Rất đậm</option></select></label></div>
<div class="act"><button id="scan">Tìm máy in trong Wi-Fi</button></div><div id="found"></div>
<div class="act"><button id="upd2">Kiểm tra cập nhật</button><a id="rel" target="_blank" rel="noopener">Mở trang tải bản mới nhất</a></div>
<div class="act"><button id="chk">Kiểm tra kết nối</button><button id="ok">Xong</button></div><p class="m"></p></dialog>
<script>
const D=[500000,200000,100000,50000,20000,10000,5000,2000,1000];
const $=s=>document.querySelector(s),f=n=>n.toLocaleString('vi-VN'),num=s=>+String(s).replace(/\D/g,'')||0;
let S={host:'192.168.50.232',port:'9100',w:'576',top:'2',bot:'8',cut:'B',pace:'0',th:'160',shop:'VH3',time:'1',bold:'1',dens:'0'};
try{Object.assign(S,JSON.parse(localStorage.kf_nt||'{}'))}catch(e){}
let R=[],total=0;
$('#tb').innerHTML=D.map((v,i)=>`<tr><td class="d">${f(v)}<td class="n"><div class="st"><button type="button" class="sb" data-i="${i}" data-d="-1" aria-label="Giảm">−</button><input id="r${i}" inputmode="numeric"><button type="button" class="sb" data-i="${i}" data-d="1" aria-label="Tăng">+</button></div><td class="d" id="a${i}">-</tr>`).join('');
$('#dt').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const say=(m,ok)=>document.querySelectorAll('.m').forEach(e=>{e.textContent=m;e.className='m '+(ok?'ok':'er')});

function tx(g,t,x,y,h,al,sz,w){let p=Math.round(sz);g.font=`bold ${p}px Arial`;while(g.measureText(String(t)).width>w&&p>10)g.font=`bold ${--p}px Arial`;g.textAlign=al;g.fillText(String(t),x,y+h/2+1);if(S.bold==='1'){g.strokeStyle=g.fillStyle;g.lineWidth=Math.max(1.2,p/20);g.lineJoin='round';g.strokeText(String(t),x,y+h/2+1)}}

function diffStr(){const due=$('#due').value?num($('#due').value):null;if(due===null)return'—';const d=total-due;return d===0?'0 (khớp)':(d>0?f(d)+' (thừa)':'-'+f(-d)+' (thiếu)')}
function draw(wd,im){
 const W=+S.w,s=W/576,rh=Math.round(44*s),hh=Math.round(50*s),h2=Math.round(44*s),T=im?16:Math.round(S.top*8),B=im?16:Math.round(S.bot*8),L=S.bold==='1'?4:2,ft=S.time==='1'?Math.round(38*s):0,dh=wd?h2+rh:0;
 const H=T+hh+10*rh+hh+dh+ft+B,c=$('#cv'),g=c.getContext('2d');
 c.width=W;c.height=H;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='middle';
 const x1=Math.round(W*.28),x2=Math.round(W*.5),fs=26*s,dmy=$('#dt').value.split('-').reverse().join('/');
 const n=new Date(),z=v=>String(v).padStart(2,'0'),now=z(n.getHours())+':'+z(n.getMinutes())+' '+z(n.getDate())+'/'+z(n.getMonth()+1)+'/'+n.getFullYear();
 let y=T;g.fillStyle='#000';g.fillRect(0,y,W,hh);g.fillStyle='#fff';
 tx(g,'MỆNH GIÁ',x1/2,y,hh,'center',21*s,x1-8);tx(g,'SỐ TỜ',(x1+x2)/2,y,hh,'center',21*s,x2-x1-8);tx(g,'THÀNH TIỀN',(x2+W)/2,y,hh,'center',21*s,W-x2-8);
 y+=hh;g.fillStyle='#000';
 R.forEach(r=>{tx(g,f(r.v),x1-14,y,rh,'right',fs,x1-20);tx(g,r.t,(x1+x2)/2,y,rh,'center',fs,x2-x1-10);tx(g,r.a?f(r.a):'-',W-14,y,rh,'right',fs,W-x2-20);y+=rh;g.fillRect(0,y,W,L)});
 const yr=y;
 tx(g,'TỔNG CỘNG',x2/2,y,rh,'center',fs,x2-10);tx(g,f(total),W-14,y,rh,'right',fs,W-x2-20);y+=rh;g.fillRect(0,y,W,L);
 const yt=y;
 tx(g,`${S.shop} NỘP DT NGÀY ${dmy}`,W/2,y,hh,'center',fs,W-16);y+=hh;g.fillRect(0,y-L,W,L);
 [[0,y],[x1,yr],[x2,yt],[W-L,y]].forEach(([x,e])=>g.fillRect(x,T,L,e-T));
 if(wd){const ys=y;g.fillRect(0,y,W,h2);g.fillStyle='#fff';
  tx(g,'DOANH THU PHẢI NỘP',x2/2,y,h2,'center',19*s,x2-8);tx(g,'CHÊNH LỆCH',(x2+W)/2,y,h2,'center',19*s,W-x2-8);
  y+=h2;g.fillStyle='#000';
  tx(g,$('#due').value?f(num($('#due').value)):'-',x2-14,y,rh,'right',fs,x2-20);tx(g,diffStr(),W-14,y,rh,'right',fs*.9,W-x2-20);
  y+=rh;g.fillRect(0,y-L,W,L);[0,x2,W-L].forEach(x=>g.fillRect(x,ys,L,y-ys))}
 if(ft)tx(g,'In lúc '+now,W/2,y,ft,'center',21*s,W-16);
}

function calc(){
 R=D.map((v,i)=>{const t=$('#r'+i).value.trim(),c=num(t);return{v,t:t===''?'':String(c),a:v*c}});
 total=R.reduce((a,r)=>a+r.a,0);
 R.forEach((r,i)=>$('#a'+i).textContent=r.a?f(r.a):'-');
 $('#tot').textContent=total?f(total):'-';
 const dmy=$('#dt').value.split('-').reverse().join('/');
 $('#dl').textContent=`${S.shop} NỘP DT NGÀY ${dmy}`;
 const due=$('#due').value?num($('#due').value):null,e=$('#diff');
 if(due===null)e.textContent='—';else{const d=total-due;e.textContent=d===0?'0 (khớp)':(d>0?f(d)+' (thừa)':'-'+f(-d)+' (thiếu)');e.style.color=d?'var(--red)':'#0a7a3d'}
 draw();
}

function job(){
 const c=$('#cv'),w=c.width,h=c.height,px=c.getContext('2d').getImageData(0,0,w,h).data,bw=w>>3,o=[0x1b,0x40];{const dd={1:[7,100,2],2:[7,130,4],3:[7,160,8]}[S.dens];if(dd)o.push(0x1b,0x37,...dd)}
 for(let y0=0;y0<h;y0+=64){const n=Math.min(64,h-y0);o.push(0x1d,0x76,0x30,0,bw&255,bw>>8,n&255,n>>8);
  for(let y=y0;y<y0+n;y++)for(let b=0;b<bw;b++){let v=0;for(let k=0;k<8;k++){const i=(y*w+b*8+k)*4;if(px[i]*.299+px[i+1]*.587+px[i+2]*.114<S.th)v|=128>>k}o.push(v)}}
 if(S.cut==='N')o.push(0x1b,0x64,5);else o.push(0x1d,0x56,S.cut==='A'?65:66,0);
 return new Uint8Array(o);
}
const q=()=>new URLSearchParams({host:S.host,port:S.port,pace:S.pace});
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function run(op,data){
 try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TcpPrinter;if(!P)throw new Error('Chưa nạp được plugin in. Hãy cài lại bản APK mới nhất.');const j=await P[op]({host:S.host,port:+S.port,pace:+S.pace,data});say((j&&j.msg)||'Đã gửi tới máy in.',true)}
 catch(e){say((e&&e.message)||'Không kết nối được máy in.',false)}
}
const stamp=()=>{const n=new Date(),z=v=>String(v).padStart(2,'0');return $('#dt').value.replace(/-/g,'')+'-'+z(n.getHours())+z(n.getMinutes())+z(n.getSeconds())};
function choose(title,sub,opts){return new Promise(res=>{const d=$('#pick'),b=$('#pb');$('#pt').textContent=title;$('#ps').textContent=sub||'';b.innerHTML='';
 opts.forEach(o=>{const x=document.createElement('button');x.type='button';x.textContent=o.t;x.className=o.c||'';x.disabled=!!o.d;x.onclick=()=>{d.close();res(o.v)};b.appendChild(x)});
 d.oncancel=()=>res(null);d.showModal()})}
const content=t=>choose(t,'Nội dung nộp tiền gồm Doanh thu phải nộp và Chênh lệch.'+($('#due').value?'':' (Nhập Doanh thu phải nộp để chọn mục thứ hai.)'),[{t:'Chỉ bảng kê',v:0},{t:'Bảng kê và nội dung nộp tiền',v:1,d:!$('#due').value},{t:'Hủy',v:null}]);
$('#pr').onclick=async()=>{if(!total)return say('Chưa nhập số tờ nào.',false);const m=await content('In bảng kê');if(m===null)return;say('Đang gửi…',true);draw(!!m);await run('send',b64(job()));draw()};
$('#img').onclick=async()=>{if(!total)return say('Chưa nhập số tờ nào.',false);const m=await content('Xuất ảnh bảng kê');if(m===null)return;
 draw(!!m,true);const u=$('#cv').toDataURL('image/png');draw();
 try{await Capacitor.Plugins.TcpPrinter.saveImage({data:u.split(',')[1],name:'bang-ke-'+stamp()+'.png'});say('Đã lưu ảnh vào thư viện (album BangKeNopTien).',true)}
 catch(e){say((e&&e.message)||'Không lưu được ảnh.',false)}};
let H=[],hi=-1,rs=false;
const snap=()=>JSON.stringify({c:D.map((v,i)=>$('#r'+i).value),d:$('#due').value}),ub=()=>{$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=H.length-1};
function load(sn){const o=JSON.parse(sn);rs=true;o.c.forEach((v,i)=>$('#r'+i).value=v);$('#due').value=o.d;calc();rs=false}
function rec(){if(rs)return;const sn=snap();if(H[hi]===sn)return;H=H.slice(0,hi+1);H.push(sn);if(H.length>21)H.shift();hi=H.length-1;ub()}
$('#undo').onclick=()=>{if(hi>0){hi--;load(H[hi]);ub()}};
$('#redo').onclick=()=>{if(hi<H.length-1){hi++;load(H[hi]);ub()}};
$('#clr').onclick=async()=>{const v=await choose('Xóa toàn bộ?','Tất cả số tờ và doanh thu phải nộp đã nhập sẽ bị xóa. Bạn có thể bấm Hoàn tác để lấy lại.',[{t:'Xóa toàn bộ',v:1,c:'dng'},{t:'Hủy',v:null}]);if(!v)return;D.forEach((_,i)=>$('#r'+i).value='');$('#due').value='';calc();rec()};
$('#tb').onclick=e=>{const b=e.target.closest('.sb');if(!b)return;const i=+b.dataset.i,d=+b.dataset.d,x=$('#r'+i),v=num(x.value);if(d<0&&(x.value.trim()===''||v===0))return;x.value=String(Math.max(0,v+d));calc();rec()};
$('#chk').onclick=()=>run('check','');
$('#scan').onclick=async()=>{const L=$('#found');L.textContent='Đang tìm, khoảng vài giây…';
 try{const j=await Capacitor.Plugins.TcpPrinter.scan({});
  L.innerHTML=j.hosts.length?'Chọn máy in: '+j.hosts.map(h=>'<button type="button" data-h="'+h+'">'+h+'</button>').join(' '):'Không thấy máy in nào (cổng 9100) trong Wi-Fi này.';
  L.querySelectorAll('button').forEach(b=>b.onclick=()=>{const e=$('[data-k=host]');e.value=b.dataset.h;e.dispatchEvent(new Event('change'));say('Đã chọn máy in '+b.dataset.h,true);L.textContent='Đã chọn '+b.dataset.h})
 }catch(e){L.textContent='Lỗi: '+((e&&e.message)||e)}};
const VER='__VERSION__',REPO='__REPO__';
$('#ver').textContent=/^\d/.test(VER)?'v'+VER:'';
const newer=(a,b)=>{a=a.split('.').map(Number);b=b.split('.').map(Number);for(let i=0;i<3;i++)if((a[i]||0)!==(b[i]||0))return(a[i]||0)>(b[i]||0);return false};
async function updCheck(manual){
 if(!/^\d+\.\d+\.\d+$/.test(VER)){if(manual)say('Bản này chưa có số phiên bản (bản thử).',false);return}
 try{const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest');if(!r.ok)throw new Error('GitHub trả mã '+r.status);
  const j=await r.json(),v=(j.tag_name||'').replace(/^v/,''),k=(j.assets||[]).find(x=>/\.apk$/.test(x.name));
  if(!k)throw new Error('bản '+v+' chưa có file APK (có thể đang build)');

 }catch(x){if(manual)say('Không kiểm tra được: '+x.message+'. Bạn bấm "Mở trang tải bản mới nhất" bên dưới.',false)}
